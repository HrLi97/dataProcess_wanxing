
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utils_inference"
authors = []
version = "0.0.1"
dependencies = [
    "torch>=2.1",
    "pytools",
    "httpx",
    "httpcore",
    "torchvision",
    "rich",
    "tqdm",
    "pycocotools",
    "requests",
    "numpy",
    "ffmpeg-python",
    "regex",
]
description = "some function to help deploy ai models"
requires-python = ">=3.0"
license = { text = "" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["utils_inference*"]
