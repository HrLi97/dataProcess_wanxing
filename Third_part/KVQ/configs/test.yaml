data:
    val-livevqc:
        args:
            sample_types:
                fragments:
                    vqa_input: Resize
                    fragments_h: 14
                    fragments_w: 14
                    fsize_h: 32
                    fsize_w: 32
                    aligned: 8
                    clip_len: 32
                    frame_interval: 2
                    t_frag: 8
                    num_clips: 1

model:
    type: KVQ
    args:
        backbone:
            fragments:
                checkpoint: True
                act_mag_flag: True
                cross_layer: [0, 0, 1, 1]
        vqa_head:
            in_channels: 768
            hidden_channels: 64

test_load_path: ./weights/KVQ.pth
